kubernetes {

  enabled = false
  enabled = ${?KUBERNETES_COMPUTING_UNIT_ENABLED}

  compute-unit-pool-name = "texera-workflow-computing-unit"
  compute-unit-pool-name = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAME}

  compute-unit-pool-namespace = "texera-workflow-computing-unit-pool"
  compute-unit-pool-namespace = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAMESPACE}

  # Computing-unit pods are named "<prefix>-<cuid>". The mounter derives a CU's id back
  # out of the pod name, so both must be given the same value by the helm chart.
  compute-unit-pod-name-prefix = "computing-unit"
  compute-unit-pod-name-prefix = ${?KUBERNETES_COMPUTE_UNIT_POD_NAME_PREFIX}

  compute-unit-service-name = "workflow-computing-unit-svc"
  compute-unit-service-name = ${?KUBERNETES_COMPUTE_UNIT_SERVICE_NAME}

  # The project's own published computing-unit image, which is also what the helm chart
  # sets (workflowComputingUnitPool.imageName). The previous default named a personal
  # Docker Hub repository that is private or gone, so any deployment that did not
  # override it produced pods stuck in ImagePullBackOff with "pull access denied".
  image-name = "ghcr.io/apache/texera-workflow-execution-coordinator:latest"
  image-name = ${?KUBERNETES_IMAGE_NAME}

  image-pull-policy = "Always"
  image-pull-policy = ${?KUBERNETES_IMAGE_PULL_POLICY}

  port-num = 8085

  # Configuration on how many computing units one user can create
  max-num-of-running-computing-units-per-user = 10
  max-num-of-running-computing-units-per-user = ${?MAX_NUM_OF_RUNNING_COMPUTING_UNITS_PER_USER}

  computing-unit-cpu-limit-options = "1,2,4"
  computing-unit-cpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_CPU_LIMIT_OPTIONS}

  computing-unit-memory-limit-options = "1Gi,2Gi,4Gi"
  computing-unit-memory-limit-options = ${?KUBERNETES_COMPUTING_UNIT_MEMORY_LIMIT_OPTIONS}

  # GPU configuration
  computing-unit-gpu-limit-options = "0,1,2"
  computing-unit-gpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_GPU_LIMIT_OPTIONS}
  
  # A computing unit runs user-supplied code, and with curated images the image itself is
  # supplied rather than reviewed, so the container is pinned to a non-root user.
  #
  # runAsNonRoot alone is not enough: kubelet refuses to start a container whose image
  # declares its USER by name ("non-numeric user, cannot verify user is non-root"), and the
  # Texera computing-unit image declares `USER texera`. So the uid is stated too. It must
  # exist in the image -- 1001 is what that image creates, and a curated image is built
  # FROM it, which is what the mirror's validation enforces.
  computing-unit-run-as-non-root = true
  computing-unit-run-as-non-root = ${?KUBERNETES_COMPUTING_UNIT_RUN_AS_NON_ROOT}

  computing-unit-run-as-user = 1001
  computing-unit-run-as-user = ${?KUBERNETES_COMPUTING_UNIT_RUN_AS_USER}

  # RuntimeClass a GPU computing unit runs under. Kubernetes REJECTS a pod naming a
  # RuntimeClass the cluster has not defined, so on a GPU cluster that exposes GPUs through
  # the device plugin alone -- which is a normal setup -- naming one makes every GPU unit
  # fail at creation. Set it to "" there. Default keeps the previous behaviour.
  computing-unit-gpu-runtime-class = "nvidia"
  computing-unit-gpu-runtime-class = ${?KUBERNETES_COMPUTING_UNIT_GPU_RUNTIME_CLASS}

  # GPU resource key used in Kubernetes (vendor-specific)
  computing-unit-gpu-resource-key = "nvidia.com/gpu"
  computing-unit-gpu-resource-key = ${?KUBERNETES_COMPUTING_UNIT_GPU_RESOURCE_KEY}

  # Per-user JupyterLab pods. Separate from `enabled` above, so a deployment can run
  # computing units on Kubernetes without per-user Jupyter. While this is off, the
  # notebook migration service uses the single Jupyter from storage.jupyter.
  jupyter-enabled = false
  jupyter-enabled = ${?KUBERNETES_JUPYTER_ENABLED}

  jupyter-namespace = "texera-jupyter-pool"
  jupyter-namespace = ${?KUBERNETES_JUPYTER_NAMESPACE}

  jupyter-service-name = "jupyter-svc"
  jupyter-service-name = ${?KUBERNETES_JUPYTER_SERVICE_NAME}

  jupyter-image-name = "ghcr.io/apache/texera-jupyter:latest"
  jupyter-image-name = ${?KUBERNETES_JUPYTER_IMAGE_NAME}

  jupyter-port-num = 8888

  # Origin the pod names in its iframe CSP and its postMessage checks. The image defaults
  # to the local dev origin when this is empty, which suits no real deployment.
  jupyter-texera-origin = ""
  jupyter-texera-origin = ${?KUBERNETES_JUPYTER_TEXERA_ORIGIN}

  jupyter-cpu-limit = "1"
  jupyter-cpu-limit = ${?KUBERNETES_JUPYTER_CPU_LIMIT}

  jupyter-memory-limit = "2Gi"
  jupyter-memory-limit = ${?KUBERNETES_JUPYTER_MEMORY_LIMIT}

  # Browser-facing address, with {uid} substituted. The in-network pod name does not
  # resolve from the browser, so a deployment that publishes Jupyter sets this; empty
  # falls back to the in-network address.
  jupyter-public-url-template = ""
  jupyter-public-url-template = ${?KUBERNETES_JUPYTER_PUBLIC_URL_TEMPLATE}

  # Per-node mounter (out-of-pod FUSE mounting). These must match the texera-mounter
  # DaemonSet's hostPort and hostPath in the helm chart.
  mounter-port = 8100
  mounter-port = ${?KUBERNETES_MOUNTER_PORT}

  mounter-host-root = "/var/lib/texera-mounts"
  mounter-host-root = ${?KUBERNETES_MOUNTER_HOST_ROOT}
}

# Curated computing-unit images: an image an administrator has registered, which a
# computing unit can then be started from. The image is mirrored from wherever the
# administrator points at into the in-cluster registry, so a unit never pulls from an
# upstream registry at start time.
curated-images {
  enabled = true
  enabled = ${?TEXERA_CURATED_IMAGES_ENABLED}

  # Registry the mirrored copies live in, and the address a computing-unit pod pulls
  # from. An address rather than a service name because kubelet resolves it through the
  # node's DNS, not the cluster's, before the pod exists. Embedded in every mirrored
  # reference, so changing it orphans existing images.
  registry = "10.96.0.99:5000"
  registry = ${?TEXERA_CURATED_IMAGE_REGISTRY}

  # Runs the mirror. skopeo copies between registries directly and needs no daemon,
  # so the job stays unprivileged.
  mirror-image = "quay.io/skopeo/stable:v1.16.1"
  mirror-image = ${?TEXERA_CURATED_IMAGE_MIRROR_IMAGE}

  # Where mirror jobs run. The computing-unit pool namespace already exists and is
  # already where cluster-side work for this service lands.
  mirror-namespace = "texera-workflow-computing-unit-pool"
  mirror-namespace = ${?TEXERA_CURATED_IMAGE_MIRROR_NAMESPACE}

  # A mirror past this is killed. Copying tens of gigabytes over a slow upstream link
  # is legitimately slow, so this is generous compared with an ordinary job.
  mirror-timeout-seconds = 3600
  mirror-timeout-seconds = ${?TEXERA_CURATED_IMAGE_MIRROR_TIMEOUT_SECONDS}

  # A copy is almost entirely network and disk, not CPU, so this asks for very little.
  mirror-cpu-request = "200m"
  mirror-cpu-request = ${?TEXERA_CURATED_IMAGE_MIRROR_CPU_REQUEST}
  mirror-memory-request = "512Mi"
  mirror-memory-request = ${?TEXERA_CURATED_IMAGE_MIRROR_MEMORY_REQUEST}
  mirror-cpu-limit = "2"
  mirror-cpu-limit = ${?TEXERA_CURATED_IMAGE_MIRROR_CPU_LIMIT}
  mirror-memory-limit = "2Gi"
  mirror-memory-limit = ${?TEXERA_CURATED_IMAGE_MIRROR_MEMORY_LIMIT}
}
