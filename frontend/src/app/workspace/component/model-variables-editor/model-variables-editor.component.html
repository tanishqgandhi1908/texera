<div class="model-variables">
  <div
    *ngIf="rows.length === 0"
    class="model-variables-hint">
    Bind a model to a Python variable to read it from your code. It is mounted into the computing unit when the workflow
    runs.
  </div>

  <div
    class="model-variable-row"
    *ngFor="let row of rows; let i = index; trackBy: trackByIndex">
    <input
      nz-input
      class="model-variable-name"
      placeholder="variable"
      [(ngModel)]="row.variableName"
      (ngModelChange)="onRowChange()" />
    <span class="model-variable-arrow">=</span>
    <button
      nz-button
      class="model-variable-select"
      nz-tooltip
      [nzTooltipTitle]="row.modelPath || 'Choose a model version'"
      (click)="openModelPicker(i)">
      <i
        nz-icon
        nzType="experiment"></i>
      <span class="model-variable-label">{{ row.modelPath ? describePath(row.modelPath) : "Select model" }}</span>
    </button>
    <i
      nz-icon
      nzType="delete"
      class="model-variable-remove"
      nz-tooltip
      [nzTooltipTitle]="'Remove'"
      (click)="removeRow(i)"
      role="button"
      aria-label="Remove variable"></i>
  </div>

  <button
    nz-button
    nzType="dashed"
    nzSize="small"
    class="model-variables-add"
    (click)="addRow()">
    <i
      nz-icon
      nzType="plus"></i>
    Add variable
  </button>
</div>
